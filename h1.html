<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let rice = "Rice";
        let ricePrice = 60;
        let riceQuantity = 2;

        let sugar = "Sugar";
        let sugarPrice = 45;
        let sugarQuantity = 1;

        let wheat = "Wheat";
        let wheatPrice = 40;
        let wheatQuantity = 3;

        let riceCost = ricePrice * riceQuantity;
        let sugarCost = sugarPrice * sugarQuantity;
        let wheatCost = wheatPrice * wheatQuantity;
        let totalBill = riceCost + sugarCost + wheatCost;

        console.log(rice, "price:", ricePrice, "quantity:", riceQuantity, "cost:", riceCost);
        console.log(sugar, "price:", sugarPrice, "quantity:", sugarQuantity, "cost:", sugarCost);
        console.log(wheat, "price:", wheatPrice, "quantity:", wheatQuantity, "cost:", wheatCost);
        console.log("Total bill:", totalBill);

        riceQuantity = 3;
        riceCost = ricePrice * riceQuantity;
        totalBill = riceCost + sugarCost + wheatCost;

        console.log(rice, "updated quantity:", riceQuantity);
        console.log("Updated total bill:", totalBill);
    </script>
</body>
</html>
