<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2 id="birthdayDetails"></h2>

    <script>
        const friend = {
            name: "John",
            birthDate: "1999-07-05"
        };

        function getBirthdayDetails(friend) {
            const [year, month, day] = friend.birthDate.split("-");
            const birthDate = new Date(year, month - 1, day);
            const today = new Date();
            let age = today.getFullYear() - year;

            if (today < new Date(today.getFullYear(), month - 1, day)) age--;

            const monthName = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"][month - 1];
            document.getElementById("birthdayDetails").textContent = `${friend.name} was born on ${birthDate.getDate()} ${monthName}, ${birthDate.getFullYear()} and is ${age} years old.`;
        }

        getBirthdayDetails(friend);
    </script>
</body>
</html>
