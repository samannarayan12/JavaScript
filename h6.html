<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Results</title>
</head>
<body>
    <h1>Student Results</h1>
    <h2>All student names</h2>
    <p id="all-names"></p>

    <h2>Names scoring more than 60</h2>
    <p id="names-above-60"></p>

    <h2>Total score</h2>
    <p id="total-score"></p>

    <h2>Did all students pass?</h2>
    <p id="all-passed"></p>

    <h2>Did any student score more than 90?</h2>
    <p id="any-above-90"></p>

    <h2>Scores, highest to lowest</h2>
    <pre id="sorted-results"></pre>

    <script>
        const students = [
            { name: "Liam", score: 88 },
            { name: "Emma", score: 55 },
            { name: "Noah", score: 92 },
            { name: "Olivia", score: 35 },
            { name: "Ava", score: 60 },
            { name: "Ethan", score: 73 }
        ];

        const allNames = [];
        const namesAbove60 = [];
        let totalScore = 0;
        let allPassed = true;
        let anyAbove90 = false;

        for (let i = 0; i < students.length; i++) {
            const student = students[i];
            allNames.push(student.name);
            totalScore += student.score;

            if (student.score > 60) namesAbove60.push(student.name);
            if (student.score <= 35) allPassed = false;
            if (student.score > 90) anyAbove90 = true;
        }

        document.getElementById("all-names").textContent = allNames;
        document.getElementById("names-above-60").textContent = namesAbove60;
        document.getElementById("total-score").textContent = totalScore;
        document.getElementById("all-passed").textContent = allPassed;
        document.getElementById("any-above-90").textContent = anyAbove90;

        students.sort(function (a, b) { return b.score - a.score; });

        let sortedResults = "";
        for (let i = 0; i < students.length; i++) {
            sortedResults += (i + 1) + ". " + students[i].name + ": " + students[i].score + "\n";
        }
        document.getElementById("sorted-results").textContent = sortedResults;
    </script>
</body>
</html>
