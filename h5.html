<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="checkAccess">Check Admin Access</button>
    <h4 id="demo"></h4>

    <script>
        const user = {
            name: "Saman Narayan",
            age: 14,
            isAdmin: true
        };

        document.getElementById("checkAccess").addEventListener("click", function () {
            const hasAge = "age" in user;
            const canAccessAdminFeatures = hasAge && user.age >= 18 && user.isAdmin;

            document.getElementById("demo").innerHTML = `
                UserName: ${user.name}<br>
                Age: ${hasAge ? user.age : "Not available"}<br>
                Age property exists: ${hasAge}<br>
                Admin: ${user.isAdmin ? "Yes" : "No"}<br>
                ${canAccessAdminFeatures ? "Access Granted" : "Access Denied"}
            `;

            delete user.age;
        });
    </script>
</body>
</html>
