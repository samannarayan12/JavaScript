<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Math Comparison</h2>
    <p id="demo"></p>

    <script>
        const mysteryLevel = Math.floor(Math.random() * 50) + 1;
        const highValue = Math.max(10, 20, mysteryLevel);
        const lowValue = Math.min(10, 20, mysteryLevel);

        document.getElementById("demo").innerHTML = `
            Mystery Level: ${mysteryLevel}<br>
            Highest value among 10, 20, and mystery level: ${highValue}<br>
            Lowest value among 10, 20, and mystery level: ${lowValue}
        `;
    </script>
</body>
</html>
