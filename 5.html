<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="checkReturn(this)">Check Return Eligibility</button>
    <p id="result"></p>

    <script>
        const order = {
            itemName: "Headphones",
            isDelivered: true,
            daysSinceDelivery: 3
        };

        function checkReturn(button) {
            document.getElementById("result").textContent =
                (order.isDelivered && order.daysSinceDelivery <= 7
                    ? "Eligible for Return"
                    : "Return Period Expired") +
                " | itemName exists: " + ("itemName" in order);
            delete order.daysSinceDelivery;
            button.disabled = true;
        }
    </script>
</body>
</html>
